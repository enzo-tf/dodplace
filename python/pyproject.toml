[project]
name = "dodplace"
version = "0.1.0"
description = "KiCad front end for the dodplace placement engine: extraction, enrichment and IR writing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# IPC backend: talks to a running KiCad over the official IPC API.
ipc = ["kicad-python>=0.4"]
# Datasheet enrichment (phase 3).
pdf = ["pdfplumber>=0.11"]
# Optional OCCT kernel. NOT needed for STEP heights: the provider reads the
# bounding box from the file text and needs no kernel at all. This extra is for
# future volume/mass extraction, and pulls ~850 MB (OCCT + VTK).
step = ["cadquery-ocp>=7.7"]
dev = ["pytest>=8"]

[project.scripts]
dodplace = "dodplace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dodplace"]
# The shim template is data, not importable code: make sure it ships in a wheel.
artifacts = [
    "src/dodplace/plugin/main.py.src",
    "src/dodplace/plugin/requirements.txt.src",
    "src/dodplace/plugin/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
